name: Verify contribution
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Public source and tracker
    runs-on: ubuntu-latest
    env:
      SHARP_IGNORE_GLOBAL_LIBVIPS: '1'
      GITHUB_PAGES: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: status-site/package-lock.json
      - name: Check public files and artwork provenance
        run: python tools/check_public_content.py
      - name: Install asset tooling
        run: python -m pip install -r requirements-inspection.txt
      - name: Prepare disposable authored inputs
        run: python tools/asset_pipeline.py
      - name: Run Python regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check tracker snapshot and evidence
        run: python tools/refresh_tracker.py --check
      - name: Install tracker dependencies
        run: npm ci --prefix status-site
      - name: Test tracker
        run: npm test --prefix status-site
      - name: Export GitHub Pages site
        run: npm run build --prefix status-site
  core:
    name: Engine-independent runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Compile and run runtime checks
        shell: bash
        run: |
          compiler_version="$(dotnet --version)"
          python tools/build.py --roslyn "$DOTNET_ROOT/sdk/$compiler_version/Roslyn/bincore/csc.dll" --test
